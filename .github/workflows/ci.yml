name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iOS simulator
        id: sim
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no iPhone simulator available" >&2
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project AnkiLite.xcodeproj

      - name: Test
        run: |
          xcodebuild test \
            -project AnkiLite.xcodeproj \
            -scheme AnkiLite \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
