name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iOS simulator
        id: sim
        run: |
          # Prefer an iPhone running the newest installed iOS runtime, rather
          # than hard-coding a device name that may vanish from the runner image.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c '
import json, sys
data = json.load(sys.stdin)["devices"]
best = None
for runtime, devices in data.items():
    if "iOS" not in runtime:
        continue
    version = runtime.rsplit(".", 1)[-1]
    for device in devices:
        if "iPhone" in device["name"]:
            key = (version, device["name"])
            if best is None or key > best[0]:
                best = (key, device["udid"], device["name"], runtime)
if best is None:
    sys.exit("no iPhone simulator available")
print(best[1])
sys.stderr.write(f"using {best[2]} ({best[3]})\n")
')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project AnkiLite.xcodeproj

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AnkiLite.xcodeproj \
            -scheme AnkiLite \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
